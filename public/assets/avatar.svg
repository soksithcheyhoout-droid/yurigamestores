<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="cdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cdCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Rounded Hexagon Shield -->
  <polygon points="60,8 108,30 108,82 60,112 12,82 12,30" fill="url(#cdBg)" stroke="url(#cdGold)" stroke-width="2.5"/>
  <!-- Diamond Facet -->
  <g filter="url(#cdGlow)">
    <polygon points="60,24 88,44 60,94 32,44" fill="url(#cdCyan)" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="60,24 74,44 60,94 46,44" fill="#ffffff" fill-opacity="0.5"/>
    <!-- Stylized 'C' and 'D' Monogram in Center -->
    <text x="60" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="-1">CD</text>
    <!-- Gold Crown Accent at Top -->
    <polygon points="46,20 52,28 60,16 68,28 74,20 70,30 50,30" fill="url(#cdGold)"/>
  </g>
</svg>
