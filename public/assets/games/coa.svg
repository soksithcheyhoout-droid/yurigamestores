<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="coaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#coaBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="25" fill="none" stroke="#d946ef" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Floating Magitech Crystal -->
  <polygon points="60,18 80,48 60,82 40,48" fill="url(#crystalGrad)"/>
  <polygon points="60,26 72,48 60,74 48,48" fill="#ffffff" opacity="0.6"/>
  <!-- Orbiting Rings -->
  <ellipse cx="60" cy="50" rx="34" ry="12" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6 3"/>
  <!-- Banner -->
  <rect x="22" y="86" width="76" height="20" rx="6" fill="#1e1b4b" stroke="#d946ef" stroke-width="1.5"/>
  <text x="60" y="100" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="11" fill="#f5d0fe" text-anchor="middle" letter-spacing="1">ATLAN</text>
</svg>