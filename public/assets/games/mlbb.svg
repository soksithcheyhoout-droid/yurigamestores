<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="mlbbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#mlbbBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="25" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Winged Shield -->
  <path d="M60 22 L86 38 C86 68 60 92 60 92 C60 92 34 68 34 38 Z" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M60 28 L80 41 C80 64 60 84 60 84 C60 84 40 64 40 41 Z" fill="url(#cyanGrad)" opacity="0.85"/>
  <!-- Diamond Crystal Center -->
  <polygon points="60,40 73,56 60,74 47,56" fill="#ffffff" filter="url(#glow)"/>
  <polygon points="60,45 68,56 60,68 52,56" fill="url(#cyanGrad)"/>
  <!-- MLBB Banner -->
  <rect x="22" y="86" width="76" height="20" rx="6" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="60" y="100" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="12" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">MLBB</text>
</svg>